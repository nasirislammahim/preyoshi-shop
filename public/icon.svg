<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1238"/>
      <stop offset="50%" stop-color="#BE0750"/>
      <stop offset="100%" stop-color="#550A24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4"/>
      <stop offset="50%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#9C6B17"/>
    </linearGradient>
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#burgundyGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="12 6" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Decorative Corner Accents -->
  <circle cx="70" cy="70" r="6" fill="url(#goldGrad)"/>
  <circle cx="442" cy="70" r="6" fill="url(#goldGrad)"/>
  <circle cx="70" cy="442" r="6" fill="url(#goldGrad)"/>
  <circle cx="442" cy="442" r="6" fill="url(#goldGrad)"/>

  <!-- Central Emblem & Heart Crest -->
  <g filter="url(#luxuryGlow)">
    <!-- Heart & Jewel Silhouette -->
    <path d="M 256 120 C 230 85 180 85 150 115 C 115 150 120 205 160 250 L 256 345 L 352 250 C 392 205 397 150 362 115 C 332 85 282 85 256 120 Z" fill="#F8E8E9" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Stylized 'P' & Crown Monogram -->
    <!-- Crown -->
    <path d="M 226 150 L 256 125 L 286 150 L 274 165 L 238 165 Z" fill="url(#goldGrad)"/>
    <circle cx="226" cy="146" r="3.5" fill="#FFF9F2"/>
    <circle cx="256" cy="120" r="4.5" fill="#FFF9F2"/>
    <circle cx="286" cy="146" r="3.5" fill="#FFF9F2"/>

    <!-- Royal Letter P -->
    <path d="M 220 180 L 220 310 M 220 180 L 268 180 C 298 180 308 198 308 218 C 308 238 296 254 268 254 L 220 254" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Heart Sparkle inside P -->
    <path d="M 256 210 C 250 200 240 200 235 208 C 230 216 238 224 256 235 C 274 224 282 216 277 208 C 272 200 262 200 256 210 Z" fill="#BE0750"/>
  </g>

  <!-- Typography -->
  <text x="256" y="390" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="6" fill="#FFF9F2">PREYOSHI</text>
  <text x="256" y="425" text-anchor="middle" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-weight="600" font-size="22" letter-spacing="3" fill="#D9A441">প্রেয়সী শপ</text>
  <text x="256" y="452" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" letter-spacing="4" fill="#F8E8E9" opacity="0.85">YOUR STYLE ♥ OUR PRIORITY</text>
</svg>
